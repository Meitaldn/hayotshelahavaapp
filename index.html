<title>חיות של אהבה 🎭</title>
<style>
:root{
 --ink:#352a38;--muted:#756b78;--cream:#fffaf2;--paper:#fffdf8;--lav:#8b6c9c;--lav2:#efe5f3;
 --rose:#c77a92;--green:#728f79;--gold:#d9ad62;--line:#eadfe7;--shadow:0 10px 30px rgba(70,45,75,.12);
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f8f1e9,#eee5f2 55%,#f8f1e9);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:40px}
.top{position:sticky;top:0;z-index:20;background:rgba(255,250,244,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.back{width:42px;height:42px;border:0;border-radius:50%;background:white;box-shadow:var(--shadow);font-size:22px;display:none}
.brand{flex:1}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.iconBtn{border:0;background:transparent;font-size:21px;padding:8px}
.hero{padding:22px 18px 12px}
.house{background:var(--paper);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);overflow:hidden}
.house svg{display:block;width:100%;height:auto}
.hero h1{font-family:Georgia,serif;font-size:38px;margin:18px 4px 4px}
.hero p{color:var(--muted);margin:0 4px 16px}
.panel{padding:0 18px}
.card{background:rgba(255,253,248,.96);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin:12px 0}
.card h2,.card h3{margin:0 0 7px;font-family:Georgia,serif}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.role{border:1px solid var(--line);background:white;border-radius:18px;padding:12px;text-align:right;display:flex;align-items:center;gap:10px}
.role:active{transform:scale(.99)}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--lav2);display:grid;place-items:center;font-size:26px;flex:none}
.role span small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.scene{position:relative}
.scene .num{position:absolute;left:14px;top:14px;color:var(--lav);font-weight:700}
.scene h3{padding-left:48px}
.meta{color:var(--muted);font-size:13px;margin:5px 0 13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.primary,.secondary,.danger{border:0;border-radius:14px;padding:11px 14px;font-weight:700}
.primary{background:var(--lav);color:white}.secondary{background:var(--lav2);color:var(--ink)}.danger{background:#f3e0e5;color:#7d3147}
.tabs{display:flex;background:#f3ebf5;border-radius:15px;padding:4px;margin:10px 0}
.tab{flex:1;border:0;background:transparent;padding:10px;border-radius:11px;color:var(--muted);font-weight:700}
.tab.active{background:white;color:var(--ink);box-shadow:0 3px 10px rgba(70,45,75,.08)}
.reader{background:#fffdf8;border:1px solid var(--line);border-radius:22px;padding:18px;line-height:1.85;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow)}
.reader .speaker{font-weight:800;color:var(--lav);margin-top:18px}
.reader .stage{color:#7a707c;font-style:italic}
.exam{min-height:65vh}
.examHeader{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.progress{height:9px;background:#eee5ef;border-radius:99px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:var(--lav);width:0}
.otherLine{background:white;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin:14px 0}
.otherLine .who{color:var(--lav);font-weight:800;font-size:14px}.otherLine .txt{font-size:21px;line-height:1.8;margin-top:6px;white-space:pre-wrap}
.yourTurn{background:linear-gradient(145deg,#fffaf2,#f4eaf6);border:2px solid #d9c5df;border-radius:22px;padding:18px;margin-top:16px}
.yourTurn .turnLabel{font-size:25px;font-family:Georgia,serif;font-weight:700}
textarea{width:100%;min-height:120px;margin-top:12px;border:1px solid #d8cadb;border-radius:16px;padding:14px;background:white;color:var(--ink);resize:vertical;outline:none}
textarea:focus{border-color:var(--lav);box-shadow:0 0 0 3px #e9dff0}
.feedback{padding:12px;border-radius:15px;margin-top:10px;line-height:1.6}
.good{background:#e7f1e9;color:#315d3a}.bad{background:#f7e4e8;color:#763547}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.footer{padding:20px;text-align:center;color:var(--muted);font-size:12px}
.hidden{display:none!important}
@media(min-width:650px){.roles{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

function cleanSpeech(raw){
 let s=raw;
 s=s.replace(/\[[^\]]*\]/gs,' ');
 s=s.replace(/[\u200b\ufeff]/g,' ');
 s=s.replace(/\s+/g,' ').trim();
 return s;
}
function norm(s){
 return cleanSpeech(s).replace(/[.,!?;:"'״׳…\-–—()[\]{}]/g,' ').replace(/\s+/g,' ').trim();
}
function similarity(a,b){
 a=norm(a); b=norm(b);
 if(!a||!b)return 0;
 if(a===b)return 1;
 const A=a.split(' '),B=b.split(' ');
 let i=0,j=0,common=0;
 while(i<A.length&&j<B.length){if(A[i]===B[j]){common++;i++;j++}else if(A.length-i>B.length-j)i++;else j++}
 return common/Math.max(A.length,B.length);
}
function startExam(id){
 exam={scene:DATA.scenes.find(s=>s.id==id),turnIndex:0,attempts:0,correct:0,streak:0,feedback:null,started:true};

}

 <div class="progress"><i style="width:${progress}%"></i></div>
 ${prev.map(t=>`<div class="otherLine"><div class="who">${esc(t.speaker)}</div><div class="txt">${esc(cleanSpeech(t.raw))}</div></div>`).join('')}
 <div class="yourTurn"><div class="turnLabel">🎭 תורך</div><div class="meta">אמרי/כתבי את המשפט בדיוק לפי המחזה.</div>
 <textarea id="answer" autocomplete="off" placeholder="כתבי כאן את המשפט שלך..."></textarea>
 <div class="actions"><button class="primary" id="check">בדיקה ✓</button><button class="secondary" id="listen">🔊 הקראה של התור הקודם</button></div>
 <div id="feedback"></div></div></div></section>`;
 document.getElementById('readAll').onclick=()=>readerPage(s);
 document.getElementById('check').onclick=checkAnswer;
 document.getElementById('answer').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')checkAnswer()});
 document.getElementById('listen').onclick=()=>speakPrevious(prev);
 if(state.settings.voice && prev.length) setTimeout(()=>speakSequence(prev),120);
}
function speakPrevious(prev){
 if(!('speechSynthesis' in window)||!prev.length)return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(cleanSpeech(prev[prev.length-1].raw));
 u.lang='he-IL';u.rate=.92;u.pitch=1;
 speechSynthesis.speak(u);
}
function speakSequence(prev){
 if(!('speechSynthesis' in window)||!prev.length)return;
 speechSynthesis.cancel();
 prev.forEach(t=>{
   const u=new SpeechSynthesisUtterance(cleanSpeech(t.raw));
   u.lang='he-IL';u.rate=.92;u.pitch=1;
   speechSynthesis.speak(u);
 });
}
function checkAnswer(){
 const ta=document.getElementById('answer'); const given=ta.value.trim(); const target=exam.scene.turns[exam.turnIndex].raw;
 const score=similarity(given,target);
 exam.attempts++;
 const ok=score>=0.94;
 if(ok){exam.correct++;exam.streak++;exam.feedback={ok:true,score};}
 else {exam.streak=0;exam.feedback={ok:false,score,target:cleanSpeech(target)};}
 const p=state.progress[exam.scene.id]||{correct:0,attempts:0,best:0};
 p.attempts++; if(ok)p.correct++; p.best=Math.max(p.best,exam.streak); state.progress[exam.scene.id]=p; save();
 const box=document.getElementById('feedback');
 if(ok){
   box.innerHTML=`<div class="feedback good">✓ נכון! ממשיכים.</div>`;
   setTimeout(()=>{exam.turnIndex++;exam.feedback=null;render()},450);
 }else{
   box.innerHTML=`<div class="feedback bad"><b>כמעט.</b><br>הטקסט המדויק הוא:<br><strong>${esc(cleanSpeech(target))}</strong><br><small>המערכת מתעלמת מפיסוק ורווחים, אבל לא ממילים משמעותיות.</small></div>`;
   ta.focus();
 }
}
function render(){
 if(state.view==='home'||!state.role)return home();
 if(state.view==='scenes')scenesPage();
 if(state.view==='reader'){readerPage(DATA.scenes.find(s=>s.id==state.sceneId));}
 if(state.view==='exam')renderExam();
 document.getElementById('backBtn')?.addEventListener('click',()=>{
   if(state.view==='exam'||state.view==='reader')state.view='scenes';else state.view='home';save();render();
 });
 document.getElementById('roleBtn')?.addEventListener('click',()=>{state.view='home';save();render()});
 document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>startExam(+b.dataset.exam));
 document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{state.view='reader';state.sceneId=+b.dataset.read;save();render()});
}
render();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
