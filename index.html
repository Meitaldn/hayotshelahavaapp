<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#76557d"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>חיות של אהבה 🎭</title><style>
:root{--ink:#382d3d;--muted:#75697a;--cream:#fffaf1;--paper:#fffdf8;--purple:#76557d;--purple2:#a786ad;--pink:#ead9e8;--line:#eadfe7;--shadow:0 10px 28px #4a355214}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f5edf6,#fffaf2 45%,#f5efe6);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.app{max-width:780px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#fffaf1ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 14px;display:flex;align-items:center;gap:10px}.back{border:0;background:transparent;font-size:28px;color:var(--purple);width:38px}.brand{flex:1;font-weight:900}.sub{display:block;font-size:12px;color:var(--muted);font-weight:500}.top button{cursor:pointer}.screen{padding:16px}.card{background:#fffdf8e8;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}.hero{overflow:hidden;padding:0}.house{background:#eef2ec}.house svg{display:block;width:100%;height:220px}.heroText{padding:17px}.hero h1{margin:0 0 5px;font:34px Georgia,serif}.hero p{margin:0;color:var(--muted)}h2,h3{font-family:Georgia,serif}.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.role{border:2px solid var(--line);background:#fff;border-radius:18px;padding:11px;text-align:right;display:flex;align-items:center;gap:9px}.role.sel{border-color:var(--purple2);background:#fbf4fc}.avatar{width:43px;height:43px;border-radius:13px;background:#f0e4ef;display:grid;place-items:center;font-size:25px}.scene{padding:14px;border:1px solid var(--line);border-radius:18px;background:#fff;margin:10px 0}.sceneNo{font-weight:900;color:var(--purple)}.scene h3{margin:3px 0}.meta{font-size:12px;color:var(--muted)}.btn{border:0;border-radius:13px;padding:10px 13px;background:var(--purple);color:#fff;font-weight:800}.btn.secondary{background:#eee4ef;color:var(--ink)}.btn.ghost{background:transparent;color:var(--purple);padding:8px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tabs{display:flex;gap:4px;background:#f0e7ef;border-radius:14px;padding:4px;margin:10px 0}.tab{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:800;color:var(--muted)}.tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px #0001}.event{position:relative;margin:10px 0}.dialogue{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px 13px}.speaker{font-weight:900;color:var(--purple);margin-bottom:4px}.spoken{font-size:19px;line-height:1.75;white-space:pre-wrap}.stage{color:#786d7b;font-size:13px;font-style:italic;text-align:center;margin:8px 0}.noteBox{margin-top:8px;background:#fbf4fc;border:1px solid #ddcce1;border-radius:13px;padding:9px}.noteBox textarea{width:100%;min-height:68px;border:1px solid #d9cbdc;border-radius:10px;padding:9px;background:#fff;color:var(--ink);font:inherit}.noteHead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:5px}.noteSaved{font-size:11px;color:#5d7c55}.examTurn{background:#fff4c8;border:2px solid #eadb92;border-radius:18px;padding:16px;margin:12px 0}.examTurn h3{margin:0 0 4px}.answer{width:100%;min-height:105px;border:1px solid #d7cadb;border-radius:13px;padding:11px;font:inherit}.feedback{margin-top:8px;padding:11px;border-radius:13px}.good{background:#e7f1e5;color:#40583b}.bad{background:#f8e7e7;color:#713d3d}.progress{height:8px;background:#eee5ef;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--purple)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:var(--muted)}.noteItem{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin:8px 0}.empty{text-align:center;color:var(--muted);padding:25px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}@media(min-width:650px){.roles{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div id="app"></div><script>
const KEY='hayot_shel_ahava_v2'; const NOTES_KEY='hayot_shel_ahava_notes_v1'; let DATA=null, state=JSON.parse(localStorage.getItem(KEY)||'{}'), notes=JSON.parse(localStorage.getItem(NOTES_KEY)||'{}'), exam=null; const app=document.getElementById('app');
const emoji={"זוהר":"🦊","יואל":"🐿️","רון":"🐓","נעמה":"🦋","חנה":"🐔","תרנגולת":"🐔","שמואל":"🐭","עוז":"🐺","דולב":"🛵","סנאית":"🐿️","חתולה":"🐱","קוקיה":"🐦","עץ":"🌳"};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} function save(){localStorage.setItem(KEY,JSON.stringify(state))} function saveNotes(){localStorage.setItem(NOTES_KEY,JSON.stringify(notes))} function norm(s){return String(s||'').normalize('NFD').replace(/[֑-ׇ]/g,'').trim()} function cleanSpoken(s){return String(s||'').replace(/\[[\s\S]*?\]/g,' ').replace(/[​﻿]/g,' ').replace(/\s+/g,' ').trim()} function compare(s){return cleanSpoken(s).replace(/[.,!?;:"'״׳…()\[\]{}\-–—]/g,' ').replace(/\s+/g,' ').trim()}
function same(a,b){a=compare(a);b=compare(b);if(!a||!b)return false;if(a===b)return true;const A=a.split(' '),B=b.split(' ');let i=0,j=0,c=0;while(i<A.length&&j<B.length){if(A[i]===B[j]){c++;i++;j++}else if(A.length-i>B.length-j)i++;else j++}return c/Math.max(A.length,B.length)>=.94}
function house(){return '<svg viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="240" fill="#f7eadf"/><rect y="175" width="760" height="65" fill="#dfe8d8"/><path d="M130 110L380 25l250 85v115H130z" fill="#fffaf0" stroke="#76557d" stroke-width="5"/><path d="M105 112L380 18l275 94-18 34L380 62 123 146z" fill="#b96d69"/><rect x="190" y="137" width="85" height="103" fill="#efe5f3" stroke="#76557d" stroke-width="4"/><rect x="315" y="137" width="85" height="62" fill="#e7f1e9" stroke="#76557d" stroke-width="4"/><rect x="440" y="137" width="85" height="62" fill="#f4e2e8" stroke="#76557d" stroke-width="4"/><circle cx="80" cy="198" r="40" fill="#9bb38f"/><circle cx="680" cy="198" r="46" fill="#9bb38f"/></svg>'}
function shell(title,sub=''){return `<header class="top"><button class="back" id="back">‹</button><div class="brand">${esc(title)}<span class="sub">${esc(sub)}</span></div><button class="btn secondary" id="notesBtn">📝</button></header>`}
function home(){app.innerHTML=`${shell('חיות של אהבה','בחירת דמות')}<main class="screen"><div class="card hero"><div class="house">${house()}</div><div class="heroText"><h1>חיות של אהבה</h1><p>בחרי דמות כדי לראות רק את הסצנות שלה.</p></div></div><div class="card"><h2>בחרי דמות</h2><div class="roles">${DATA.roles.map(r=>`<button class="role" data-role="${esc(r)}"><span class="avatar">${emoji[r]||'🎭'}</span><span><b>${esc(r)}</b><span class="meta">${DATA.scenes.filter(s=>s.characters.map(norm).includes(norm(r))).length} סצנות</span></span></button>`).join('')}</div></div></main>`;bindCommon();document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;state.view='scenes';save();render()})}
function scenes(){const mine=DATA.scenes.filter(s=>s.characters.map(norm).includes(norm(state.role)));app.innerHTML=`${shell(state.role,'הסצנות שלך')}<main class="screen"><div class="card"><h2>הסצנות של ${esc(state.role)}</h2><div class="actions"><button class="btn secondary" id="allNotes">📝 כל ההערות שלי</button></div></div>${mine.map(s=>`<div class="scene"><div class="sceneNo">סצנה ${s.id}</div><h3>${esc(s.title)}</h3><div class="meta">${s.characters.join(' · ')}</div><div class="actions"><button class="btn" data-exam="${s.id}">🎭 בחינה</button><button class="btn secondary" data-read="${s.id}">📖 צפייה בטקסט</button></div></div>`).join('')}</main>`;bindCommon();document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>startExam(+b.dataset.exam));document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{state.view='reader';state.sceneId=+b.dataset.read;save();render()});document.getElementById('allNotes').onclick=notesPage}
function splitStage(text){const out=[];let last=0,re=/\[[\s\S]*?\]/g,m;while((m=re.exec(text))){if(m.index>last)out.push({type:'spoken',text:text.slice(last,m.index)});out.push({type:'stage',text:m[0]});last=m.index+m[0].length}if(last<text.length)out.push({type:'spoken',text:text.slice(last)});return out.filter(x=>x.text.trim())}
function noteKey(scene,event){return `${state.role}|${scene.id}|${event}`}
function noteEditor(scene,event,inline=false){const k=noteKey(scene,event),v=notes[k]||'';return `<div class="noteBox"><div class="noteHead"><b>📝 ההערה שלי</b><span class="noteSaved">נשמרת בטלפון אוטומטית</span></div><textarea data-note="${scene.id}:${event}" placeholder="כתבי לעצמך הערה..."></textarea></div>`}
function bindNotes(){document.querySelectorAll('[data-note]').forEach(t=>{const [sid,eid]=t.dataset.note.split(':');const k=noteKey(DATA.scenes.find(s=>s.id==sid),eid);t.value=notes[k]||'';t.addEventListener('input',()=>{notes[k]=t.value;saveNotes()})})}
function reader(){const s=DATA.scenes.find(x=>x.id==state.sceneId);let html='';s.events.forEach((e,i)=>{if(e.type==='stage'){html+=`<div class="stage">${esc(e.text)}</div>`;return}html+=`<div class="event"><div class="dialogue"><div class="speaker">${esc(e.speaker)}:</div>${splitStage(e.text).map(x=>x.type==='stage'?`<div class="stage">${esc(x.text)}</div>`:`<div class="spoken">${esc(x.text.trim())}</div>`).join('')}</div>${noteEditor(s,i)}</div>`});app.innerHTML=`${shell('סצנה '+s.id,'צפייה מלאה בטקסט')}<main class="screen"><div class="card"><h2>${esc(s.title)}</h2><div class="tabs"><button class="tab active">📖 צפייה בטקסט</button><button class="tab" id="examGo">🎭 בחינה</button></div>${html}</div></main>`;bindCommon();bindNotes();document.getElementById('examGo').onclick=()=>startExam(s.id)}
function startExam(id){const s=DATA.scenes.find(x=>x.id===id);exam={scene:s,index:-1,attempts:0,correct:0,streak:0};advance();state.view='exam';state.sceneId=id;save();render()}
function advance(){const es=exam.scene.events;for(let i=exam.index+1;i<es.length;i++){if(es[i].type==='dialogue'&&norm(es[i].speaker)===norm(state.role)){exam.index=i;return}}exam.index=es.length}
function examView(){const s=exam.scene,es=s.events;if(exam.index>=es.length){app.innerHTML=`${shell('סיום · סצנה '+s.id,'כל התורות שלך הושלמו')}<main class="screen"><div class="card"><h2>כל הכבוד 🎉</h2><div class="stats"><div class="stat"><b>${exam.correct}</b><span>הצלחות</span></div><div class="stat"><b>${exam.attempts}</b><span>ניסיונות</span></div><div class="stat"><b>${exam.streak}</b><span>רצף</span></div></div><div class="actions"><button class="btn" id="again">🔁 שוב</button><button class="btn secondary" id="reader">📖 הטקסט</button></div></div></main>`;bindCommon();document.getElementById('again').onclick=()=>startExam(s.id);document.getElementById('reader').onclick=()=>{state.view='reader';save();render()};return}
let previous=[];for(let i=exam.index-1;i>=0;i--){if(es[i].type==='dialogue'&&norm(es[i].speaker)===norm(state.role))break;previous.unshift(es[i])}let before=previous.map(e=>e.type==='stage'?`<div class="stage">${esc(e.text)}</div>`:`<div class="dialogue"><div class="speaker">${esc(e.speaker)}:</div><div class="spoken">${esc(cleanSpoken(e.text))}</div></div>`).join('');const target=cleanSpoken(es[exam.index].text);const pct=Math.round((exam.index/Math.max(1,es.length))*100);app.innerHTML=`${shell('בחינה · סצנה '+s.id,'כשהתור שלך מגיע הטקסט מוסתר')}<main class="screen"><div class="card"><h2>${esc(s.title)}</h2><div class="progress"><i style="width:${pct}%"></i></div>${before}<div class="examTurn"><h3>🎭 תורך · ${esc(state.role)}</h3><div class="meta">כתבי את המשפט לפי המחזה.</div><textarea class="answer" id="answer" placeholder="המשפט שלך..."></textarea>${noteEditor(s,exam.index)}<div class="actions"><button class="btn" id="check">בדיקה ✓</button><button class="btn secondary" id="readText">📖 הטקסט</button></div><div id="feedback"></div></div></div></main>`;bindCommon();bindNotes();document.getElementById('check').onclick=check;document.getElementById('readText').onclick=()=>{state.view='reader';save();render()}}
function check(){const target=cleanSpoken(exam.scene.events[exam.index].text),given=document.getElementById('answer').value;exam.attempts++;const ok=same(given,target);const box=document.getElementById('feedback');if(ok){exam.correct++;exam.streak++;box.innerHTML='<div class="feedback good">✓ נכון! ממשיכים.</div>';setTimeout(()=>{advance();render()},450)}else{exam.streak=0;box.innerHTML=`<div class="feedback bad"><b>לא בדיוק.</b><br>הטקסט המדויק הוא:<br><strong>${esc(target)}</strong></div>`}}
function notesPage(){const arr=[];DATA.scenes.forEach(s=>s.events.forEach((e,i)=>{const v=notes[noteKey(s,i)];if(v)arr.push({s,e,i,v})}));app.innerHTML=`${shell('ההערות שלי',state.role)}<main class="screen"><div class="card"><h2>📝 ההערות שלי</h2>${arr.length?arr.map(x=>`<div class="noteItem"><b>סצנה ${x.s.id} · ${esc(x.e.speaker||'הוראת במה')}</b><div>${esc(x.v)}</div></div>`).join(''):'<div class="empty">עדיין אין הערות. אפשר להוסיף אותן ליד כל משפט.</div>'}</div></main>`;bindCommon()}
function bindCommon(){document.getElementById('back')?.addEventListener('click',()=>{if(state.view==='scenes'||state.view==='home')state.view='home';else state.view='scenes';save();render()});document.getElementById('notesBtn')?.addEventListener('click',notesPage)}
function render(){if(!DATA)return;if(!state.role||state.view==='home')home();else if(state.view==='scenes')scenes();else if(state.view==='reader')reader();else if(state.view==='exam'&&exam)examView();else home()}
fetch('./script-data.json').then(r=>r.json()).then(d=>{DATA=d;render()}).catch(()=>{app.innerHTML='<div class="card">שגיאה בטעינת המחזה. רענני את הדף.</div>'});if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
