<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#765080">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>חיות של אהבה 🎭</title>
<style>
:root{--purple:#765080;--purple2:#eee2f1;--ink:#302735;--muted:#776d7a;--paper:#fffdf9;--line:#eadfe9;--green:#5d7c55;--yellow:#fff4c8;--shadow:0 7px 24px rgba(75,48,80,.11)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7eee6,#f1e9f2 62%,#faf3eb);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:20;background:#fffaf4ef;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:9px}.back{width:43px;height:43px;border:0;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:28px;line-height:1}.brand{flex:1;font-weight:900;font-size:18px}.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}.iconBtn{border:0;background:transparent;font-size:22px;padding:8px}.screen{padding:12px 16px 45px}.card{background:#fffdf9ee;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px;margin:11px 0}.hero{padding:0;overflow:hidden}.house{margin:16px;border-radius:25px;overflow:hidden;background:#dcebed}.house svg{width:100%;display:block}.heroText{padding:4px 20px 22px;text-align:right}.hero h1{font:42px Georgia,serif;margin:0 0 6px}.hero p{font-size:17px;color:var(--muted);margin:0;line-height:1.5}.homeBtns{display:flex;gap:9px;overflow:auto;padding:0 2px}.btn{border:0;border-radius:15px;padding:12px 17px;background:var(--purple);color:white;font-weight:800;font-size:15px;white-space:nowrap}.btn.secondary{background:var(--purple2);color:var(--ink)}.btn.ghost{background:transparent;color:var(--purple);border:1px solid var(--line)}h2,h3{margin:0 0 7px;font-family:Georgia,serif}.meta{font-size:13px;color:var(--muted)}.roleRow{display:flex;gap:9px;align-items:center;margin-top:12px}.roleSelect{flex:1;border:1px solid #d9ccd9;border-radius:13px;padding:12px;background:#fff;font:inherit;color:var(--ink);min-width:0}.checkRole{border:0;border-radius:13px;padding:12px 13px;background:var(--purple);color:#fff;font-weight:800}.myRoles{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{background:#f0e3f2;border:1px solid #dcc9e0;border-radius:999px;padding:7px 10px;font-size:13px}.chip button{border:0;background:none;margin-right:4px;color:#7b5d83;font-weight:900}.scene{padding:15px;border:1px solid var(--line);border-radius:19px;background:#fff;margin:10px 0}.sceneNo{display:inline-block;background:#eee2f1;color:var(--purple);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.scene h3{font-size:23px;margin:8px 0 3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.progress{height:7px;background:#e9e0e7;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--purple)}.tabs{display:flex;gap:4px;background:#f0e7f2;border-radius:14px;padding:4px;margin:10px 0}.tab{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:800;color:var(--muted)}.tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px #0001}.event{margin:10px 0}.dialogue{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px 14px}.speaker{font-weight:900;color:var(--purple);margin-bottom:4px}.spoken{font-size:19px;line-height:1.78;white-space:pre-wrap}.stage{color:#776d7a;font-size:14px;font-style:italic;text-align:center;margin:9px 2px;line-height:1.5}.noteBox{margin-top:8px;background:#fbf4fc;border:1px solid #dfcfe3;border-radius:13px;padding:9px}.noteHead{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}.noteBox textarea{width:100%;min-height:65px;border:1px solid #d9cbdc;border-radius:10px;padding:9px;background:#fff;color:var(--ink);font:inherit;resize:vertical}.saved{color:var(--green)}.examContext{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}.examContext .spoken{font-size:18px}.yourTurn{background:var(--yellow);border:2px solid #eadb92;border-radius:19px;padding:16px;margin:13px 0}.yourTurn h3{font-size:25px}.answer{width:100%;min-height:105px;border:1px solid #d7cadb;border-radius:13px;padding:11px;font:inherit;background:#fff}.feedback{margin-top:8px;padding:11px;border-radius:12px}.good{background:#e7f1e5;color:#40583b}.bad{background:#f8e7e7;color:#713d3d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:var(--muted)}.noteItem{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin:8px 0}.empty{text-align:center;color:var(--muted);padding:25px}.install{background:linear-gradient(135deg,#eee2f1,#f8efe6)}@media(min-width:650px){.screen{padding-left:22px;padding-right:22px}}
.characterGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.characterCard{border:1px solid var(--line);border-radius:18px;background:#fff;padding:13px;text-align:right;color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 2px 8px #00000008}
.characterCard:active{transform:scale(.98)}
.characterCard.selected{border:2px solid var(--purple);background:#faf3fc}
.charTitle{display:flex;align-items:center;gap:7px;font-size:18px}
.charEmoji{font-size:28px}
.chosen{margin-right:auto;background:var(--purple2);color:var(--purple);border-radius:999px;padding:4px 7px;font-size:10px}
.charBlurb{font-size:13px;line-height:1.5;color:var(--muted);margin:8px 0;min-height:58px}
.selectedRole{display:flex;align-items:center;justify-content:space-between;gap:10px}
.selectedRole>div{display:flex;align-items:center;gap:8px}
.selectedRole h2{margin:0}
@media(max-width:430px){.characterGrid{grid-template-columns:1fr}}
/* Hebrew text + mixed punctuation: keep brackets, quotes and punctuation in logical order */
.spoken,.stage,.speaker{direction:rtl;unicode-bidi:plaintext;text-align:right}
.spoken{white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere}
.stage{unicode-bidi:plaintext}

.roleChooser{overflow:visible}
.roleSelect{width:100%;min-height:48px;border:1px solid #d9ccd9;border-radius:14px;padding:11px 14px;background:#fff;color:var(--ink);font:inherit;font-size:17px}
.roleBlurb{margin-top:12px;padding:12px 14px;border-radius:14px;background:#faf3fc;border:1px solid #dfcfe3;color:var(--muted);font-size:14px;line-height:1.6}
.roleBlurbTitle{color:var(--purple);font-weight:900;font-size:18px;margin-bottom:4px}
.originalText{direction:rtl;unicode-bidi:plaintext;white-space:pre-wrap;text-align:right}
</style>
</head>
<body><div class="app" id="app"></div>
<script>
const KEY='hayot_shel_ahava_v4_state';
const NOTES_KEY='hayot_shel_ahava_notes_v1';
let DATA=null;
let state=JSON.parse(localStorage.getItem(KEY)||'{}');
let notes=JSON.parse(localStorage.getItem(NOTES_KEY)||'{}');
let exam=null;
let deferredInstall=null;
const app=document.getElementById('app');

const emoji={"זוהר":"🦊","יואל":"🐿️","רון":"🐓","נעמה":"🦋","חנה":"🐔","תרנגולת":"🐔","שמואל":"🐭","עוז":"🐺","דולב":"🛵","סנאית":"🐿️","חתולה":"🐱","קוקיה":"🐦","עץ":"🌳"};

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function saveNotes(){localStorage.setItem(NOTES_KEY,JSON.stringify(notes))}
function norm(s){return String(s||'').normalize('NFD').replace(/[֑-ׇ]/g,'').trim()}
function cleanSpoken(s){return String(s||'').replace(/\[[\s\S]*?\]/g,' ').replace(/[​﻿]/g,' ').replace(/\s+/g,' ').trim()}
function compare(s){return cleanSpoken(s).replace(/[.,!?;:"'״׳…()\[\]{}\-–—]/g,' ').replace(/\s+/g,' ').trim()}
function same(a,b){
 a=compare(a);b=compare(b);if(!a||!b)return false;if(a===b)return true;
 const A=a.split(' '),B=b.split(' ');let i=0,j=0,c=0;
 while(i<A.length&&j<B.length){if(A[i]===B[j]){c++;i++;j++}else if(A.length-i>B.length-j)i++;else j++}
 return c/Math.max(A.length,B.length)>=.94
}
function selectedRoles(){return state.role?[state.role]:[]}
function shell(title,sub=''){
 return `<header class="top"><button class="back" id="back" aria-label="חזרה">←</button><div class="brand">${esc(title)}<small>${esc(sub)}</small></div><button class="iconBtn" id="notesBtn" aria-label="הערות">📝</button></header>`
}
function house(){
 return `<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="270" fill="#dcebed"/><circle cx="95" cy="82" r="32" fill="#f5d983"/><rect y="205" width="760" height="65" fill="#b8d19f"/><path d="M170 130L380 55l210 75v115H170z" fill="#fff3d9" stroke="#765080" stroke-width="5"/><path d="M145 132L380 45l235 87-15 31-220-81-220 81z" fill="#b85f61"/><rect x="225" y="145" width="82" height="62" fill="#d8edf0" stroke="#765080" stroke-width="4"/><rect x="339" y="145" width="82" height="62" fill="#d8edf0" stroke="#765080" stroke-width="4"/><rect x="453" y="145" width="82" height="62" fill="#d8edf0" stroke="#765080" stroke-width="4"/><circle cx="266" cy="176" r="15" fill="#f2ca75"/><circle cx="380" cy="176" r="15" fill="#f2ca75"/><circle cx="494" cy="176" r="15" fill="#f2ca75"/><path d="M95 220q0-55 35-70M130 220q15-45 48-58" fill="none" stroke="#71976c" stroke-width="9" stroke-linecap="round"/></svg>`
}
const BLURBS={"זוהר": "מחפשת אהבה ולא מוכנה לוותר עליה. גם כשקשה, היא ממשיכה לחפש את הדבר האמיתי.", "יואל": "נחוש לתפוס את הזדמנות חייו. הוא מחפש, מתכנן ולא רוצה לפספס את הרגע.", "רון": "מחפש את זוהר, אבל גם יודע ליהנות מבירה וממשהו קטן לאכול בדרך.", "נעמה": "כלה צעירה ונרגשת, שרוצה אהבה אמיתית ומנסה להבין מה הלב שלה באמת רוצה.", "חנה": "אמא של נעמה. מתרגשת, דואגת לבת שלה ותמיד יש לה מה להגיד על מה שקורה סביבה.", "תרנגולת": "שכנה מעורבת מאוד בחיי הבניין, שתמיד יש לה מה להגיד כשמשהו מתחיל להשתבש.", "שמואל": "אבא של נעמה. מגונן עליה, דואג לה ומנסה לעזור לה בדרך שלו.", "עוז": "שחקן מפורסם ובטוח בעצמו, שמכיר היטב את עולם הבמה והאהבות שמאחוריה.", "דולב": "שליח וולט שנכנס לתוך הסיפור בדיוק כשהכול מתחיל להסתבך.", "סנאית": "שכנה סקרנית שמוצאת את עצמה עמוק בתוך כל הדרמה של הבניין.", "חתולה": "שכנה חדה וסקרנית, חלק מהחבורה שמנסה להבין מה באמת קורה.", "קוקיה": "שכנה שמצטרפת לחבורה ולחיפושים כשהסיפור מתחיל להסתבך.", "עץ": "חלק מהעולם הבימתי של המחזה, שמופיע בסצנות המתאימות."};
function home(){
 const roles=DATA.roles||[], current=state.role||'';
 const scenes=current?DATA.scenes.filter(s=>(s.characters||[]).some(c=>norm(c)===norm(current))):[];
 const options=roles.map(r=>`<option value="${esc(r)}" ${norm(r)===norm(current)?'selected':''}>${emoji[r]||'🎭'} ${esc(r)}</option>`).join('');
 const selectedInfo=current?`<div class="roleBlurb"><div class="roleBlurbTitle">${emoji[current]||'🎭'} ${esc(current)}</div><div>${esc(BLURBS[current]||'דמות מתוך המחזה חיות של אהבה.')}</div></div>`:'';
 const main=current?`
 <div class="card roleChooser"><h2>🎭 הדמות שלך</h2><select class="roleSelect" id="roleSelect">${options}</select>${selectedInfo}</div>
 <div class="card"><h2>🎬 הסצנות שלי</h2><div class="meta">רק הסצנות שבהן ${esc(current)} משתתפת.</div>${scenes.map(sceneCard).join('')}</div>`
 :`
 <div class="card roleChooser"><h2>🎭 בחרי את הדמות שלך</h2><div class="meta">גללי ברשימה ובחרי דמות.</div><select class="roleSelect" id="roleSelect"><option value="" selected disabled>בחרי דמות...</option>${options}</select></div>`;
 app.innerHTML=shell('חיות של אהבה','חזרות · סצנות · טקסט · סטטיסטיקה')+`<main class="screen">
 <div class="card hero"><div class="house">${house()}</div><div class="heroText"><h1>חיות של אהבה</h1><p>חדר טקסט אופליין · סצנות · תור · סטטיסטיקה</p></div></div>
 <div class="homeBtns"><button class="btn" id="scenesBtn">סצנות</button><button class="btn" id="progressBtn">התקדמות</button></div>
 ${main}
 <div class="card install"><h3>📲 שמירה בטלפון</h3><p class="meta">אפשר להוסיף את חיות של אהבה למסך הבית ולהיכנס אליה כמו לאפליקציה.</p><button class="btn" id="installBtn">הוספה למסך הבית</button></div>
 </main>`;
 bindCommon();bindSceneButtons();
 document.getElementById('scenesBtn').onclick=()=>scenesPage();
 document.getElementById('progressBtn').onclick=progressPage;
 document.getElementById('installBtn').onclick=installApp;
 document.getElementById('roleSelect').onchange=e=>{state.role=e.target.value;save();home()};
}
function renderHome(){state.view='home';save();home()}
function sceneCard(s){
 const p=state.progress?.[s.id]||{correct:0,attempts:0};
 const pct=p.attempts?Math.min(100,Math.round((p.correct/Math.max(1,p.attempts))*100)):0;
 return `<div class="scene"><span class="sceneNo">סצנה ${s.id}</span><h3>${esc(s.title)}</h3><div class="meta">${s.characters.join(' · ')}</div>${p.attempts?`<div class="meta">${p.correct} הצלחות · ${p.attempts} ניסיונות</div><div class="progress"><i style="width:${pct}%"></i></div>`:''}<div class="actions"><button class="btn" data-exam="${s.id}">🎭 בחינה</button><button class="btn secondary" data-read="${s.id}">📖 צפייה בטקסט</button></div></div>`
}
function scenesPage(){
 const scenes=DATA.scenes||[];
 app.innerHTML=shell('סצנות','כל סצנות המחזה')+
 `<main class="screen"><div class="card"><h2>כל הסצנות</h2>${scenes.map(sceneCard).join('')}</div></main>`;
 bindCommon();bindSceneButtons();
}
function bindSceneButtons(){
 document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>startExam(+b.dataset.exam));
 document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>reader(+b.dataset.read));
}
function splitStage(text){
 const out=[];let last=0,re=/\[[\s\S]*?\]/g,m;
 while((m=re.exec(text))){if(m.index>last)out.push({type:'spoken',text:text.slice(last,m.index)});out.push({type:'stage',text:m[0]});last=m.index+m[0].length}
 if(last<text.length)out.push({type:'spoken',text:text.slice(last)});
 return out.filter(x=>x.text.trim())
}
function reader(id){
 const s=DATA.scenes.find(x=>x.id===id);
 if(!s){home();return}
 let html='';
 (s.events||[]).forEach(e=>{
   if(e.type==='stage'){
     html+=`<div class="stage">${esc(e.text)}</div>`;
   }else{
     html+=`<div class="event"><div class="dialogue"><div class="speaker">${esc(e.speaker)}:</div><div class="spoken originalText">${esc(e.text)}</div></div></div>`;
   }
 });
 app.innerHTML=shell('סצנה '+s.id,'צפייה מלאה בטקסט')+
 `<main class="screen"><div class="card"><h2>${esc(s.title)}</h2>
 <div class="tabs"><button class="tab active">📖 צפייה בטקסט</button><button class="tab" id="goExam">🎭 בחינה</button></div>
 ${html||'<div class="empty">אין טקסט להצגה בסצנה הזאת.</div>'}
 </div></main>`;
 bindCommon();
 document.getElementById('goExam').onclick=()=>startExam(s.id);
}
function startExam(id){
 const s=DATA.scenes.find(x=>x.id===id);
 if(!s)return;
 const role=state.role;
 if(!role){home();return}
 exam={scene:s,index:-1,attempts:0,correct:0,streak:0,role};
 advance();
 examPage();
}
function advance(){
 const es=exam.scene.events||[];
 for(let i=exam.index+1;i<es.length;i++){
   if(es[i].type==='dialogue'&&norm(es[i].speaker)===norm(exam.role)){exam.index=i;return}
 }
 exam.index=es.length;
}
function examPage(){
 const s=exam.scene,es=s.events||[];
 if(exam.index>=es.length){
   app.innerHTML=shell('סיום · סצנה '+s.id,'כל התורות שלך הושלמו')+
   `<main class="screen"><div class="card"><h2>כל הכבוד 🎉</h2>
   <div class="stats"><div class="stat"><b>${exam.correct}</b><span>הצלחות</span></div><div class="stat"><b>${exam.attempts}</b><span>ניסיונות</span></div><div class="stat"><b>${exam.streak}</b><span>רצף</span></div></div>
   <div class="actions"><button class="btn" id="again">🔁 שוב</button><button class="btn secondary" id="reader">📖 הטקסט</button></div></div></main>`;
   bindCommon();document.getElementById('again').onclick=()=>startExam(s.id);document.getElementById('reader').onclick=()=>reader(s.id);return;
 }
 let context=[];
 for(let i=exam.index-1;i>=0;i--){if(es[i].type==='dialogue'&&norm(es[i].speaker)===norm(exam.role))break;context.unshift(es[i])}
 const html=context.map(e=>e.type==='stage'?`<div class="stage">${esc(e.text)}</div>`:`<div class="examContext"><div class="speaker">${esc(e.speaker)}:</div>${splitStage(e.text).map(x=>x.type==='stage'?`<div class="stage">${esc(x.text)}</div>`:`<div class="spoken">${esc(x.text.trim())}</div>`).join('')}</div>`).join('');
 const target=es[exam.index].text;
 app.innerHTML=shell('בחינה · סצנה '+s.id,'הדמות שלך: '+exam.role)+
 `<main class="screen"><div class="card"><h2>${esc(s.title)}</h2><div class="progress"><i style="width:${Math.round((exam.index/Math.max(1,es.length))*100)}%"></i></div>${html}
 <div class="yourTurn"><h3>🎭 תורך</h3><div class="meta">כתבי את המשפט לפי המחזה.</div><textarea class="answer" id="answer" placeholder="המשפט שלך..."></textarea>
 <div class="actions"><button class="btn" id="check">בדיקה ✓</button><button class="btn secondary" id="readNow">📖 צפייה בטקסט</button></div><div id="feedback"></div></div></div></main>`;
 bindCommon();document.getElementById('check').onclick=()=>check(target);document.getElementById('readNow').onclick=()=>reader(s.id);
}
function check(target){
 const input=document.getElementById('answer').value;exam.attempts++;
 const ok=same(input,target);const p=state.progress?.[exam.scene.id]||{correct:0,attempts:0,best:0};p.attempts++;
 if(ok){exam.correct++;exam.streak++;p.correct++;p.best=Math.max(p.best,exam.streak);state.progress=state.progress||{};state.progress[exam.scene.id]=p;save();document.getElementById('feedback').innerHTML='<div class="feedback good">✓ נכון! ממשיכים...</div>';setTimeout(()=>{advance();examPage()},450)}
 else{exam.streak=0;state.progress=state.progress||{};state.progress[exam.scene.id]=p;save();document.getElementById('feedback').innerHTML=`<div class="feedback bad"><b>לא בדיוק.</b><br>הטקסט המדויק:<br><strong>${esc(cleanSpoken(target))}</strong></div>`}
}
function progressPage(){
 const mine=selectedRoles();app.innerHTML=shell('התקדמות','לפי הדמויות שבחרת')+`<main class="screen"><div class="card"><h2>📈 ההתקדמות שלי</h2>${DATA.scenes.filter(s=>mine.some(r=>s.characters.includes(r))).map(s=>{const p=state.progress?.[s.id]||{correct:0,attempts:0};return `<div class="scene"><b>סצנה ${s.id} · ${esc(s.title)}</b><div class="meta">${p.correct||0} הצלחות · ${p.attempts||0} ניסיונות</div></div>`}).join('')}</div></main>`;bindCommon()
}
function scrollToId(id){document.querySelector('.card:nth-of-type(3)')?.scrollIntoView({behavior:'smooth'})}
function installApp(){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(()=>{deferredInstall=null})}else alert('אם לא הופיע חלון התקנה: בכרום לחצי ⋮ ואז "הוספה למסך הבית" או "התקנת אפליקציה".')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e})
function bindCommon(){
 document.getElementById('back')?.addEventListener('click',()=>{state.view='home';save();home()});
 document.getElementById('notesBtn')?.addEventListener('click',notesPage);
}
function render(){
 if(!DATA)return;
 if(state.view==='reader'&&state.sceneId)return reader(state.sceneId);
 if(state.view==='exam'&&exam)return examPage();
 if(state.view==='scenes')return scenesPage();
 if(state.view==='progress')return progressPage();
 return home();
}
fetch('./script-data.json?v=8',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;state.roles=selectedRoles();state.progress=state.progress||{};state.view='home';save();render()}).catch(()=>{app.innerHTML='<main class="screen"><div class="card">לא הצלחתי לטעון את המחזה. רענני את הדף.</div></main>'});
if('serviceWorker' in navigator)window.addEventListener('load',async()=>{
 try{
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(r=>r.unregister()));
   const keys=await caches.keys();
   await Promise.all(keys.map(k=>caches.delete(k)));
   await navigator.serviceWorker.register('./sw.js?v=7');
 }catch(e){}
});
</script>
